<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>拨开世界之琴弦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Noto Serif SC", "Songti SC", "STSong", "PingFang SC", serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #mainCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: block;
      touch-action: none;
    }

    #webcam {
      position: fixed;
      top: 0; left: 0;
      width: 1px; height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #fadeOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      opacity: 1;
      pointer-events: none;
      z-index: 100;
      transition: none;
    }

    #fadeOverlay.active {
      pointer-events: all;
    }

    #startMask {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, #1a1208 0%, #0a0804 60%, #000 100%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    /* 背景几何纹样（CSS 绘制） */
    #startMask::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(circle at 20% 30%, rgba(200,168,94,0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(200,168,94,0.03) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(200,168,94,0.02) 0%, transparent 70%);
      animation: bgPulse 8s ease-in-out infinite;
    }

    /* 边框装饰线 */
    #startMask::after {
      content: '';
      position: absolute;
      top: 20px; left: 20px;
      right: 20px; bottom: 20px;
      border: 1px solid rgba(200,168,94,0.15);
      border-radius: 4px;
      pointer-events: none;
    }

    .start-ornament {
      position: absolute;
      width: 100%;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .start-ornament.top { top: 40px; }
    .start-ornament.bottom { bottom: 40px; }

    .start-ornament svg {
      width: clamp(180px, 40vw, 400px);
      height: auto;
      opacity: 0.35;
    }

    .start-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    /* 副标题 */
    .start-subtitle {
      font-size: clamp(11px, 2.2vw, 16px);
      color: rgba(200, 168, 94, 0.5);
      letter-spacing: 0.8em;
      margin-bottom: 18px;
      font-weight: 300;
    }

    #startMask h1 {
      font-size: clamp(30px, 7vw, 60px);
      color: #d4b876;
      letter-spacing: 0.2em;
      text-shadow:
        0 0 50px rgba(200, 168, 94, 0.35),
        0 0 100px rgba(200, 168, 94, 0.1),
        0 2px 8px rgba(0,0,0,0.7);
      margin-bottom: 8px;
      font-weight: 600;
      animation: titleGlow 4s ease-in-out infinite;
    }

    /* 分隔线 */
    .start-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0 20px;
      opacity: 0.4;
    }

    .start-divider .line {
      width: clamp(40px, 10vw, 80px);
      height: 1px;
      background: linear-gradient(90deg, transparent, #c8a85e, transparent);
    }

    .start-divider .diamond {
      width: 6px; height: 6px;
      background: #c8a85e;
      transform: rotate(45deg);
    }

    #startMask p {
      font-size: clamp(12px, 2vw, 16px);
      color: rgba(200, 168, 94, 0.45);
      letter-spacing: 0.4em;
      font-weight: 300;
      animation: breathe 3s ease-in-out infinite 1s;
    }

    /* 角落装饰 */
    .corner-deco {
      position: absolute;
      width: 30px; height: 30px;
      border-color: rgba(200,168,94,0.25);
      border-style: solid;
      border-width: 0;
    }
    .corner-deco.tl { top: 35px; left: 35px; border-top-width: 1px; border-left-width: 1px; }
    .corner-deco.tr { top: 35px; right: 35px; border-top-width: 1px; border-right-width: 1px; }
    .corner-deco.bl { bottom: 35px; left: 35px; border-bottom-width: 1px; border-left-width: 1px; }
    .corner-deco.br { bottom: 35px; right: 35px; border-bottom-width: 1px; border-right-width: 1px; }

    @keyframes breathe {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 40px rgba(200,168,94,0.2), 0 0 80px rgba(200,168,94,0.05), 0 2px 4px rgba(0,0,0,0.5); }
      50% { text-shadow: 0 0 50px rgba(200,168,94,0.4), 0 0 100px rgba(200,168,94,0.15), 0 2px 4px rgba(0,0,0,0.5); }
    }

    @keyframes bgPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* 乐器图片 — 全屏铺满 */
    .start-instrument-wrap {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    /* 渐变遮罩：四周暗角 + 顶部加深保证文字可读 */
    .start-instrument-wrap::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at center, rgba(15,10,5,0.2) 0%, rgba(10,8,4,0.65) 70%, rgba(5,3,1,0.9) 100%),
        linear-gradient(to bottom, rgba(15,10,5,0.8) 0%, rgba(15,10,5,0.3) 30%, rgba(15,10,5,0.5) 70%, rgba(10,6,2,0.85) 100%);
      pointer-events: none;
    }

    .start-instrument {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 35%;
      opacity: 0.5;
      filter: sepia(30%) brightness(0.65) contrast(1.15) saturate(0.7);
      animation: instrumentBreath 10s ease-in-out infinite;
    }

    @keyframes instrumentBreath {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.58; transform: scale(1.03); }
    }

    /* 开始界面粒子画布 */
    #startParticles {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    #sceneTitle {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 90;
      pointer-events: none;
      text-align: center;
      opacity: 0;
    }

    #sceneTitle h2 {
      font-size: clamp(30px, 7vw, 60px);
      color: #d4b876;
      letter-spacing: 0.3em;
      text-shadow:
        0 0 50px rgba(200, 168, 94, 0.5),
        0 0 100px rgba(200, 168, 94, 0.2),
        0 2px 8px rgba(0,0,0,0.7);
      margin-bottom: 12px;
      font-weight: 600;
    }

    #sceneTitle .title-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
      opacity: 0.4;
    }

    #sceneTitle .title-divider .line {
      width: 50px; height: 1px;
      background: linear-gradient(90deg, transparent, #c8a85e, transparent);
    }

    #sceneTitle .title-divider .diamond {
      width: 5px; height: 5px;
      background: #c8a85e;
      transform: rotate(45deg);
    }

    #sceneTitle p {
      font-size: clamp(11px, 1.8vw, 14px);
      color: rgba(200, 168, 94, 0.35);
      letter-spacing: 0.25em;
    }

    #sceneVideo {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      z-index: 150;
      display: none;
      background: #000;
      pointer-events: none;
    }

    #waveHint {
      display: none;
      pointer-events: none;
      text-align: center;
      margin-top: 20px;
    }

    /* 点击提示动画 — 脉冲光圈 */
    #waveHint .click-icon {
      width: clamp(44px, 7vw, 64px);
      height: clamp(44px, 7vw, 64px);
      display: inline-block;
      position: relative;
    }

    #waveHint .click-ring {
      fill: none;
      stroke: rgba(200, 168, 94, 0.5);
      stroke-width: 1.5;
      animation: clickPulse 2s ease-in-out infinite;
    }

    #waveHint .click-ring:nth-child(2) { animation-delay: 0.6s; }
    #waveHint .click-ring:nth-child(3) { animation-delay: 1.2s; }

    #waveHint .click-dot {
      fill: rgba(200, 168, 94, 0.6);
      animation: clickDotPulse 2s ease-in-out infinite;
    }

    @keyframes clickPulse {
      0%, 100% { r: 8; opacity: 0.6; }
      50% { r: 24; opacity: 0; }
    }

    @keyframes clickDotPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.25; }
    }

    #waveHint .wave-text {
      font-size: clamp(12px, 2vw, 16px);
      color: rgba(200, 168, 94, 0.55);
      letter-spacing: 0.4em;
      font-weight: 300;
      margin-top: 8px;
      animation: breathe 3s ease-in-out infinite;
    }
  </style>
</head>
<body>

  <canvas id="mainCanvas"></canvas>
  <video id="webcam" autoplay playsinline></video>
  <video id="sceneVideo" playsinline preload="auto"></video>
  <audio id="bgmAudio" src="audio/bgm_start.mp3" loop preload="auto"></audio>

  <div id="fadeOverlay"></div>

  <div id="startMask">
    <!-- 乐器图片背景（占满下半屏 + 渐变渐隐） -->
    <div class="start-instrument-wrap">
      <img class="start-instrument" src="images/instrument.jpg" alt="" />
    </div>

    <!-- 星尘粒子画布 -->
    <canvas id="startParticles"></canvas>

    <!-- 角落装饰 -->
    <div class="corner-deco tl"></div>
    <div class="corner-deco tr"></div>
    <div class="corner-deco bl"></div>
    <div class="corner-deco br"></div>

    <!-- 顶部纹样 -->
    <div class="start-ornament top">
      <svg viewBox="0 0 400 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 20 L40 20 L50 10 L60 20 L80 20 L90 10 L100 20 L120 20 L130 10 L140 20 L160 20" stroke="#c8a85e" stroke-width="0.5" opacity="0.6"/>
        <path d="M240 20 L260 20 L270 10 L280 20 L300 20 L310 10 L320 20 L340 20 L350 10 L360 20 L400 20" stroke="#c8a85e" stroke-width="0.5" opacity="0.6"/>
        <circle cx="200" cy="20" r="4" stroke="#c8a85e" stroke-width="0.5" fill="none" opacity="0.5"/>
        <circle cx="200" cy="20" r="8" stroke="#c8a85e" stroke-width="0.3" fill="none" opacity="0.3"/>
        <line x1="165" y1="20" x2="192" y2="20" stroke="#c8a85e" stroke-width="0.5" opacity="0.5"/>
        <line x1="208" y1="20" x2="235" y2="20" stroke="#c8a85e" stroke-width="0.5" opacity="0.5"/>
        <path d="M170 16 L175 20 L170 24" stroke="#c8a85e" stroke-width="0.3" fill="none" opacity="0.4"/>
        <path d="M230 16 L225 20 L230 24" stroke="#c8a85e" stroke-width="0.3" fill="none" opacity="0.4"/>
      </svg>
    </div>

    <!-- 主内容 -->
    <div class="start-content">
      <div class="start-subtitle">寰 宇 弦 歌</div>
      <h1>拨开世界之琴弦</h1>
      <div class="start-divider">
        <div class="line"></div>
        <div class="diamond"></div>
        <div class="line"></div>
      </div>
      <p>点击任意处开始旅程</p>
    </div>

    <!-- 底部纹样 -->
    <div class="start-ornament bottom">
      <svg viewBox="0 0 400 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 20 L40 20 L50 30 L60 20 L80 20 L90 30 L100 20 L120 20 L130 30 L140 20 L160 20" stroke="#c8a85e" stroke-width="0.5" opacity="0.6"/>
        <path d="M240 20 L260 20 L270 30 L280 20 L300 20 L310 30 L320 20 L340 20 L350 30 L360 20 L400 20" stroke="#c8a85e" stroke-width="0.5" opacity="0.6"/>
        <circle cx="200" cy="20" r="4" stroke="#c8a85e" stroke-width="0.5" fill="none" opacity="0.5"/>
        <circle cx="200" cy="20" r="8" stroke="#c8a85e" stroke-width="0.3" fill="none" opacity="0.3"/>
        <line x1="165" y1="20" x2="192" y2="20" stroke="#c8a85e" stroke-width="0.5" opacity="0.5"/>
        <line x1="208" y1="20" x2="235" y2="20" stroke="#c8a85e" stroke-width="0.5" opacity="0.5"/>
        <path d="M170 24 L175 20 L170 16" stroke="#c8a85e" stroke-width="0.3" fill="none" opacity="0.4"/>
        <path d="M230 24 L225 20 L230 16" stroke="#c8a85e" stroke-width="0.3" fill="none" opacity="0.4"/>
      </svg>
    </div>
  </div>

  <div id="sceneTitle">
    <h2 id="sceneTitleText"></h2>
    <div class="title-divider">
      <div class="line"></div>
      <div class="diamond"></div>
      <div class="line"></div>
    </div>
    <p>轻触屏幕或按任意键，再拨一曲</p>
    <div id="waveHint">
      <svg class="click-icon" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 脉冲光圈 -->
        <circle class="click-ring" cx="36" cy="36" r="8"/>
        <circle class="click-ring" cx="36" cy="36" r="8"/>
        <circle class="click-ring" cx="36" cy="36" r="8"/>
        <!-- 中心点 -->
        <circle class="click-dot" cx="36" cy="36" r="6"/>
        <!-- 十字线 -->
        <line x1="36" y1="18" x2="36" y2="28" stroke="rgba(200,168,94,0.35)" stroke-width="1" stroke-linecap="round"/>
        <line x1="36" y1="44" x2="36" y2="54" stroke="rgba(200,168,94,0.35)" stroke-width="1" stroke-linecap="round"/>
        <line x1="18" y1="36" x2="28" y2="36" stroke="rgba(200,168,94,0.35)" stroke-width="1" stroke-linecap="round"/>
        <line x1="44" y1="36" x2="54" y2="36" stroke="rgba(200,168,94,0.35)" stroke-width="1" stroke-linecap="round"/>
      </svg>
      <p class="wave-text">点击任意处，观看影像</p>
    </div>
  </div>

  <!-- MediaPipe Hands (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"></script>

  <!-- Howler.js -->
  <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>

  <!-- App modules -->
  <script src="audio.js"></script>
  <script src="canvas.js"></script>
  <script src="app.js"></script>

  <script>
    // ── 开始界面星尘粒子 ──
    (function () {
      const canvas = document.getElementById('startParticles');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let rafId = null;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      function spawn() {
        const W = window.innerWidth;
        const H = window.innerHeight;
        for (let i = 0; i < 2; i++) {
          const r = 200 + Math.floor(Math.random() * 55);
          const g = 160 + Math.floor(Math.random() * 50);
          const b = 50 + Math.floor(Math.random() * 40);
          particles.push({
            x: Math.random() * W,
            y: H + 10,
            vx: (Math.random() - 0.5) * 0.5,
            vy: -(0.3 + Math.random() * 0.8),
            size: 1 + Math.random() * 2.5,
            life: 1.0,
            decay: 0.003 + Math.random() * 0.005,
            r, g, b,
            _fill: `rgb(${r},${g},${b})`,
            drift: Math.random() * Math.PI * 2,
            driftSpeed: 0.005 + Math.random() * 0.01,
          });
        }
      }

      let frame = 0;
      function tick() {
        frame++;
        if (frame % 3 === 0) spawn();

        const W = window.innerWidth;
        const H = window.innerHeight;
        ctx.clearRect(0, 0, W, H);

        ctx.shadowBlur = 4;
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= p.decay;
          if (p.life <= 0) { particles.splice(i, 1); continue; }

          p.drift += p.driftSpeed;
          p.x += p.vx + Math.sin(p.drift) * 0.3;
          p.y += p.vy;

          const alpha = p.life * 0.5;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p._fill;
          ctx.shadowColor = `rgba(${p.r},${p.g},${p.b},${alpha * 0.5})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        rafId = requestAnimationFrame(tick);
      }
      tick();

      // 点击后停止粒子动画
      document.getElementById('startMask').addEventListener('pointerdown', function stop() {
        if (rafId) cancelAnimationFrame(rafId);
        canvas.style.display = 'none';
        document.getElementById('startMask').removeEventListener('pointerdown', stop);
      }, { once: true });
    })();

    window.addEventListener('DOMContentLoaded', () => {
      const app = new AppCore();
      app.init();
    });
  </script>

</body>
</html>
